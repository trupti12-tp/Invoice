<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SIKKO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-left">
      <div class="login-logo">
        <img src="logo.png" alt="SIKKO Logo" class="logo-icon" style="height: 40px; width: auto; object-fit: contain;">
        <span>SIKKO</span>
      </div>
      <h1>Welcome Back!</h1>
      <p>Log in to your account to manage invoices, clients, and reports seamlessly.</p>
      <div class="login-illustration">
        <i class="fa-solid fa-file-invoice-dollar" style="font-size: 8rem; color: rgba(255,255,255,0.2);"></i>
      </div>
    </div>
    <div class="login-right">
      <div class="login-form-container">
        <h2>Sign In</h2>
        <p class="text-muted">Enter your credentials to access the dashboard</p>
        
        <form id="loginForm" class="mt-2">
          <div class="input-group">
            <label>Email Address</label>
            <div class="input-with-icon">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" id="email" placeholder="admin@sikko.com" required>
            </div>
          </div>
          
          <div class="input-group mt-2">
            <label>Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" placeholder="••••••••" required>
            </div>
          </div>
          
          <div class="login-options mt-2">
            <label class="remember-me">
              <input type="checkbox" checked>
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>
          
          <button type="submit" class="btn btn-primary login-btn mt-2">
            <span>Log In</span> <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Simple redirect to the index.html page
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
